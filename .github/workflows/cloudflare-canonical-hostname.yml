name: Configure canonical Pages hostname

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type alexnava-me.pages.dev to reconcile the exact-host redirect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-canonical-hostname
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alexnava.me
    steps:
      - name: Validate exact target and ref
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "::error::Canonical hostname changes must run from main."
            exit 1
          fi
          if [ "$CONFIRM" != "alexnava-me.pages.dev" ]; then
            echo "::error::Confirmation must exactly match alexnava-me.pages.dev."
            exit 1
          fi

      # actions/checkout@v6.0.2
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node@v6.2.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Reconcile exact-host Bulk Redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REDIRECTS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/configure-cloudflare-canonical-redirect.mjs

      - name: Verify apex remains direct and indexable
        shell: bash
        run: |
          apex_headers="$RUNNER_TEMP/apex-headers.txt"
          curl --fail --silent --show-error \
            --dump-header "$apex_headers" \
            --output /dev/null \
            --max-redirs 0 \
            "https://alexnava.me/"
          if grep -Eiq '^location:' "$apex_headers"; then
            echo "::error::The apex must remain a direct 200 response."
            exit 1
          fi
          if grep -Eiq '^x-robots-tag:.*noindex' "$apex_headers"; then
            echo "::error::The apex must remain indexable."
            exit 1
          fi
